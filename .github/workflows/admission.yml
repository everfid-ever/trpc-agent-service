name: Repository admission

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-1-21:
    name: Go 1.21 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: false
      - name: Fresh-cache build, static checks and unit tests
        run: bash scripts/ci_admission.sh

  race-1-21:
    name: Go 1.21 race suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: false
      - name: Fresh-cache race tests
        run: bash scripts/ci_admission.sh --race

  minimal-backend-smoke:
    name: Disposable PG16, Redis7, Qdrant and Vault smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Assert Compose input is valid
        run: docker compose -f deploy/compose/docker-compose.minimal.yml config --quiet
      - name: Run isolated backend smoke
        run: bash scripts/minimal_backend_smoke.sh

  helm-role-contract:
    name: Helm render and role lifecycle contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate the non-secret production example
        run: bash scripts/helm_admission.sh --output-dir release-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: helm-role-contract-${{ github.sha }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 14

  external-smoke-preflight:
    name: External smoke is explicitly skipped without approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record the unapproved external-resource state
        run: bash scripts/external_smoke_preflight.sh --evidence-dir external-smoke-evidence
      - name: Assert the report is a skip, not a pass
        run: grep -Fx 'overall=SKIPPED' external-smoke-evidence/external-smoke-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: external-smoke-preflight-${{ github.sha }}
          path: external-smoke-evidence
          if-no-files-found: error
          retention-days: 14
