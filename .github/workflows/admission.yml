name: Repository admission

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-1-24:
    name: Go 1.24 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - name: Fresh-cache build, static checks and unit tests
        run: bash scripts/ci_admission.sh

  race-1-24:
    name: Go 1.24 race suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - name: Fresh-cache race tests
        run: bash scripts/ci_admission.sh --race

  coverage:
    name: Coverage floor and PR diff ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - name: Enforce repository and changed-line coverage
        env:
          TRPC_MIN_TOTAL_COVERAGE: '41.0'
          TRPC_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/coverage_gate.sh

  vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  migration-e2e:
    name: Migration e2e — PostgreSQL schema and control plane
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Assert Compose input is valid
        run: docker compose -f deploy/compose/docker-compose.backend-smoke.yml config --quiet
      - name: Run PostgreSQL migration e2e with no skipped contracts
        run: bash scripts/backend_adapter_smoke.sh migration

  runtime-e2e:
    name: Runtime e2e — PostgreSQL, Redis and worker recovery slice
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Redis-backed runtime e2e with no skipped contracts
        run: bash scripts/backend_adapter_smoke.sh runtime

  storage-e2e:
    name: Storage e2e — MinIO, Qdrant and Vault adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus configuration
        run: >-
          docker run --rm
          --volume "$PWD/deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          --entrypoint promtool
          prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
          check config /etc/prometheus/prometheus.yml
      - name: Run object, vector and secret storage e2e
        run: bash scripts/backend_adapter_smoke.sh storage

  im-e2e:
    name: IM e2e — signed callbacks and durable duplicate ingress
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - name: Run repository-verifiable IM protocol e2e
        run: bash scripts/im_e2e.sh

  fault-e2e:
    name: Fault e2e — SIGKILL multi-node handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Supply a non-secret placeholder for bootstrap-only model configuration
        run: |
          mkdir -p deploy/compose/secrets
          printf '%s\n' 'ci-placeholder-not-a-model-credential' > deploy/compose/secrets/deepseek-api-key
      - name: Kill one live composition node and verify the peer remains ready
        run: bash scripts/local_multinode_smoke.sh

  credential-free-final-acceptance:
    name: Empty DB, fake provider and SSE final acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - name: Run static gate and credential-free demo acceptance
        run: bash scripts/ci_admission.sh --demo
