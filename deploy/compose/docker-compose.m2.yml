name: trpc-agent-m2

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${M2_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${M2_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${M2_POSTGRES_DB:-trpc_agent_service_test}
    ports:
      - "${M2_POSTGRES_PORT:-55432}:5432"
    volumes:
      - m2-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  compliance-postgres:
    image: postgres:16
    profiles: ["gateway-worker", "audit", "audit-migration"]
    environment:
      POSTGRES_USER: ${M2_COMPLIANCE_POSTGRES_USER:-compliance}
      POSTGRES_PASSWORD: ${M2_COMPLIANCE_POSTGRES_PASSWORD:-compliance}
      POSTGRES_DB: ${M2_COMPLIANCE_POSTGRES_DB:-trpc_agent_compliance}
    ports:
      - "${M2_COMPLIANCE_POSTGRES_PORT:-55433}:5432"
    volumes:
      - m2-compliance-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${M2_REDIS_PORT:-56379}:6379"
    volumes:
      - m2-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    profiles: ["gateway-worker"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${M2_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${M2_MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${M2_MINIO_PORT:-59000}:9000"
      - "${M2_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - m2-minio:/data

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["gateway-worker", "audit", "webui", "webui-multinode", "feishu-local", "wecom-local"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${M2_JAEGER_PORT:-56686}:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    profiles: ["gateway-worker", "audit", "webui", "webui-multinode", "feishu-local", "wecom-local"]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "${M2_OTEL_HTTP_PORT:-54318}:4318"
      - "${M2_OTEL_PROMETHEUS_PORT:-59464}:9464"
    depends_on:
      jaeger:
        condition: service_started

  runtime-test:
    image: golang:1.25-bookworm
    profiles: ["runtime-test"]
    working_dir: /src
    volumes:
      - ../..:/src:ro
    environment:
      TRPC_MIGRATION_TEST: "1"
      TRPC_RUNTIME_TEST: "1"
      TRPC_POSTGRES_ADMIN_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_POSTGRES_TEST_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_REDIS_TEST_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bash", "scripts/runtime_slice_test.sh"]

  webui-local:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["webui"]
    command: ["webui-local"]
    env_file:
      - path: .env.m2
        required: false
    environment:
      TRPC_POSTGRES_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_REDIS_ADDRESS: redis:6379
      TRPC_LISTEN_ADDRESS: ":8080"
      TRPC_WEBUI_LOCAL_EXCLUSIVE_RUNTIME: "true"
      TRPC_WEBUI_DEEPSEEK_KEY_FILE: /run/secrets/deepseek_api_key
      TRPC_OTEL_ENDPOINT: http://otel-collector:4318
      TRPC_OTEL_ALLOW_INSECURE: "true"
      TRPC_SERVICE_VERSION: ${M2_SERVICE_VERSION:-development}
    secrets:
      - deepseek_api_key
    ports:
      - "${M2_WEBUI_PORT:-58081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Development-only real Feishu callback and delivery loop. It intentionally
  # reuses the WebUI local composition so PostgreSQL, Redis, the model worker,
  # durable relays and delivery ledger are all exercised without cloud infra.
  feishu-local:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["feishu-local"]
    command: ["im-local"]
    env_file:
      - path: .env.m2
        required: false
      - path: secrets/feishu.env
        required: true
    environment:
      TRPC_POSTGRES_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_REDIS_ADDRESS: redis:6379
      TRPC_LISTEN_ADDRESS: ":8080"
      TRPC_WEBUI_LOCAL_EXCLUSIVE_RUNTIME: "true"
      TRPC_FEISHU_LOCAL_ENABLED: "true"
      TRPC_WEBUI_DEEPSEEK_KEY_FILE: /run/secrets/deepseek_api_key
      TRPC_OTEL_ENDPOINT: http://otel-collector:4318
      TRPC_OTEL_ALLOW_INSECURE: "true"
      TRPC_SERVICE_VERSION: ${M2_SERVICE_VERSION:-development}
    secrets:
      - deepseek_api_key
    ports:
      - "${M2_FEISHU_LOCAL_PORT:-58086}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Development-only real WeCom callback and delivery loop. Like feishu-local,
  # it reuses the WebUI local composition while keeping app credentials in an
  # ignored env file and all state in local Docker services.
  wecom-local:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["wecom-local"]
    command: ["wecom-local"]
    env_file:
      - path: .env.m2
        required: false
      - path: secrets/wecom.env
        required: true
    environment:
      TRPC_POSTGRES_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_REDIS_ADDRESS: redis:6379
      TRPC_LISTEN_ADDRESS: ":8080"
      TRPC_WEBUI_LOCAL_EXCLUSIVE_RUNTIME: "true"
      TRPC_WECOM_LOCAL_ENABLED: "true"
      TRPC_WEBUI_DEEPSEEK_KEY_FILE: /run/secrets/deepseek_api_key
      TRPC_OTEL_ENDPOINT: http://otel-collector:4318
      TRPC_OTEL_ALLOW_INSECURE: "true"
      TRPC_SERVICE_VERSION: ${M2_SERVICE_VERSION:-development}
    secrets:
      - deepseek_api_key
    ports:
      - "${M2_WECOM_LOCAL_PORT:-58087}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # The multi-node profile uses the same durable PostgreSQL/Redis authorities
  # as webui-local, but starts two independently identified composition nodes.
  # Bootstrap runs once so the nodes contend only on runtime work, never on
  # fixture creation. Each node writes its own scoped secret projection inside
  # its disposable container filesystem.
  webui-bootstrap:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["webui-multinode"]
    command: ["webui-local-bootstrap"]
    env_file:
      - path: .env.m2
        required: false
    environment:
      TRPC_POSTGRES_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_REDIS_ADDRESS: redis:6379
      TRPC_WEBUI_DEEPSEEK_KEY_FILE: /run/secrets/deepseek_api_key
      TRPC_WEBUI_LOCAL_INSTANCE_ID: bootstrap
    secrets:
      - deepseek_api_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webui-node-a:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["webui-multinode"]
    command: ["webui-local"]
    env_file:
      - path: .env.m2
        required: false
    environment:
      TRPC_POSTGRES_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_REDIS_ADDRESS: redis:6379
      TRPC_LISTEN_ADDRESS: ":8080"
      TRPC_WEBUI_DEEPSEEK_KEY_FILE: /run/secrets/deepseek_api_key
      TRPC_WEBUI_LOCAL_INSTANCE_ID: node-a
      TRPC_OTEL_ENDPOINT: http://otel-collector:4318
      TRPC_OTEL_ALLOW_INSECURE: "true"
      TRPC_SERVICE_VERSION: ${M2_SERVICE_VERSION:-development}
    secrets:
      - deepseek_api_key
    ports:
      - "${M2_MULTINODE_NODE_A_PORT:-58083}:8080"
    depends_on:
      webui-bootstrap:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  webui-node-b:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["webui-multinode"]
    command: ["webui-local"]
    env_file:
      - path: .env.m2
        required: false
    environment:
      TRPC_POSTGRES_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_REDIS_ADDRESS: redis:6379
      TRPC_LISTEN_ADDRESS: ":8080"
      TRPC_WEBUI_DEEPSEEK_KEY_FILE: /run/secrets/deepseek_api_key
      TRPC_WEBUI_LOCAL_INSTANCE_ID: node-b
      TRPC_OTEL_ENDPOINT: http://otel-collector:4318
      TRPC_OTEL_ALLOW_INSECURE: "true"
      TRPC_SERVICE_VERSION: ${M2_SERVICE_VERSION:-development}
    secrets:
      - deepseek_api_key
    ports:
      - "${M2_MULTINODE_NODE_B_PORT:-58084}:8080"
    depends_on:
      webui-bootstrap:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["gateway-worker"]
    command: ["gateway"]
    env_file:
      - path: .env.m2
        required: false
    environment:
      TRPC_POSTGRES_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_SECRET_ROOT: /run/secrets/trpc
      TRPC_LISTEN_ADDRESS: ":8080"
      TRPC_OTEL_ENDPOINT: http://otel-collector:4318
      TRPC_OTEL_ALLOW_INSECURE: "true"
      TRPC_SERVICE_VERSION: ${M2_SERVICE_VERSION:-development}
    volumes:
      - ./secrets:/run/secrets/trpc:ro
    ports:
      - "${M2_GATEWAY_PORT:-58080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      otel-collector:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["gateway-worker"]
    command: ["worker"]
    env_file:
      - path: .env.m2
        required: false
    environment:
      TRPC_POSTGRES_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_REDIS_ADDRESS: redis:6379
      TRPC_S3_ENDPOINT: http://minio:9000
      TRPC_S3_PATH_STYLE: "true"
      TRPC_SECRET_ROOT: /run/secrets/trpc
      TRPC_LISTEN_ADDRESS: ":8080"
      TRPC_OTEL_ENDPOINT: http://otel-collector:4318
      TRPC_OTEL_ALLOW_INSECURE: "true"
      TRPC_SERVICE_VERSION: ${M2_SERVICE_VERSION:-development}
    volumes:
      - ./secrets:/run/secrets/trpc:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      otel-collector:
        condition: service_started

  audit-relay:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["gateway-worker", "audit"]
    command: ["audit-relay"]
    env_file:
      - path: .env.m2
        required: false
    environment:
      TRPC_POSTGRES_DSN: postgres://${M2_POSTGRES_USER:-postgres}:${M2_POSTGRES_PASSWORD:-postgres}@postgres:5432/${M2_POSTGRES_DB:-trpc_agent_service_test}?sslmode=disable
      TRPC_AUDIT_COMPLIANCE_POSTGRES_DSN: postgres://${M2_COMPLIANCE_POSTGRES_USER:-compliance}:${M2_COMPLIANCE_POSTGRES_PASSWORD:-compliance}@compliance-postgres:5432/${M2_COMPLIANCE_POSTGRES_DB:-trpc_agent_compliance}?sslmode=disable
      TRPC_LISTEN_ADDRESS: ":8080"
      TRPC_AUDIT_LAG_POLL_INTERVAL: ${M2_AUDIT_LAG_POLL_INTERVAL:-5s}
      TRPC_AUDIT_LAG_ALERT_AGE: ${M2_AUDIT_LAG_ALERT_AGE:-5m}
      TRPC_AUDIT_LAG_ALERT_COUNT: ${M2_AUDIT_LAG_ALERT_COUNT:-10000}
      TRPC_OTEL_ENDPOINT: http://otel-collector:4318
      TRPC_OTEL_ALLOW_INSECURE: "true"
      TRPC_SERVICE_VERSION: ${M2_SERVICE_VERSION:-development}
    ports:
      - "${M2_AUDIT_PORT:-58082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      compliance-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  audit-compliance-migrate:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["audit-migration"]
    command: ["audit-compliance-migrate"]
    environment:
      TRPC_AUDIT_COMPLIANCE_POSTGRES_DSN: postgres://${M2_COMPLIANCE_POSTGRES_USER:-compliance}:${M2_COMPLIANCE_POSTGRES_PASSWORD:-compliance}@compliance-postgres:5432/${M2_COMPLIANCE_POSTGRES_DB:-trpc_agent_compliance}?sslmode=disable
    depends_on:
      compliance-postgres:
        condition: service_healthy

volumes:
  m2-postgres:
  m2-compliance-postgres:
  m2-redis:
  m2-minio:

secrets:
  deepseek_api_key:
    file: ./secrets/deepseek-api-key
