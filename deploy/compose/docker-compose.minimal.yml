name: trpc-agent-minimal

# Minimal disposable backend environment for the 0909 smoke. Unlike the M2
# compose (which binds 0.0.0.0 for local development), every host port here is
# bound to 127.0.0.1 only. Services talk to each other over the compose network;
# the host ports exist solely for optional debugging and never face the LAN.
# Nothing here uses IM, model, S3, OTEL or Kubernetes credentials.

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: trpc, POSTGRES_PASSWORD: trpc_test_password, POSTGRES_DB: postgres}
    ports:
      - "127.0.0.1:${TRPC_MINIMAL_PG_PORT:-55434}:5432"
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U trpc -d postgres"], interval: 2s, timeout: 3s, retries: 30}

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${TRPC_MINIMAL_REDIS_PORT:-56381}:6379"
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 3s, retries: 30}

  # The Qdrant image ships a Debian-slim runtime with neither wget, curl nor
  # bash, so it cannot self-report a shell healthcheck. The smoke container
  # waits for /healthz instead; keep this service on service_started.
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "127.0.0.1:${TRPC_MINIMAL_QDRANT_PORT:-56334}:6333"

  vault:
    image: hashicorp/vault:1.18
    cap_add: ["IPC_LOCK"]
    command: server -dev -dev-root-token-id=trpc-dev-token -dev-listen-address=0.0.0.0:8200
    ports:
      - "127.0.0.1:${TRPC_MINIMAL_VAULT_PORT:-58202}:8200"
    healthcheck: {test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null"], interval: 2s, timeout: 3s, retries: 30}

  smoke:
    image: golang:1.25-bookworm
    working_dir: /src
    volumes: [../..:/src:ro]
    environment:
      TRPC_MIGRATION_TEST: "1"
      TRPC_RUNTIME_TEST: "1"
      TRPC_POSTGRES_ADMIN_DSN: postgres://trpc:trpc_test_password@postgres:5432/postgres?sslmode=disable
      TRPC_REDIS_TEST_ADDR: redis:6379
      TRPC_QDRANT_TEST_ENDPOINT: http://qdrant:6333
      TRPC_VAULT_TEST_ENDPOINT: http://vault:8200
      TRPC_VAULT_TEST_TOKEN: trpc-dev-token
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      vault: {condition: service_healthy}
    command: ["bash", "scripts/minimal_backend_smoke_inside.sh"]
