{{- range $roleName, $role := .Values.roles }}
{{- if and $role.enabled $role.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trpc-agent-service.fullname" $ }}-{{ $roleName }}
  labels:
    {{- include "trpc-agent-service.roleLabels" (dict "root" $ "roleName" $roleName) | nindent 4 }}
  {{- with $role.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $role.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "trpc-agent-service.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    trpc-agent-service.io/role: {{ $roleName }}
  ports:
    - name: http
      port: {{ $role.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
