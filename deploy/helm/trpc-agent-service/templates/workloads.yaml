{{- range $roleName, $role := .Values.roles }}
{{- if $role.enabled }}
{{- $mountRuntimeSecrets := and $.Values.secretProvider.enabled (ne $roleName "audit-relay") (ne $roleName "audit-purge") (ne $roleName "business-audit-purge") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trpc-agent-service.fullname" $ }}-{{ $roleName }}
  labels:
    {{- include "trpc-agent-service.roleLabels" (dict "root" $ "roleName" $roleName) | nindent 4 }}
spec:
  {{- if not $role.autoscaling.enabled }}
  replicas: {{ $role.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "trpc-agent-service.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      trpc-agent-service.io/role: {{ $roleName }}
  template:
    metadata:
      labels:
        {{- include "trpc-agent-service.roleLabels" (dict "root" $ "roleName" $roleName) | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "trpc-agent-service.fullname" $ }}-{{ $roleName }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $role.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "trpc-agent-service.name" $ }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
              trpc-agent-service.io/role: {{ $roleName }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "trpc-agent-service.name" $ }}
                    app.kubernetes.io/instance: {{ $.Release.Name }}
                    trpc-agent-service.io/role: {{ $roleName }}
      containers:
        - name: {{ $roleName }}
          image: {{ include "trpc-agent-service.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $roleName | quote }}]
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TRPC_LISTEN_ADDRESS
              value: ":8080"
            - name: TRPC_PRESTOP_TARGET_PID
              value: "1"
            - name: TRPC_PRESTOP_SETTLE_DELAY
              value: {{ $role.preStopSettleDelay | quote }}
            - name: TRPC_SERVICE_VERSION
              value: {{ $.Values.telemetry.serviceVersion | quote }}
            - name: TRPC_LOG_LEVEL
              value: {{ $.Values.logging.level | quote }}
            - name: TRPC_LOG_MASKING_LEVEL
              value: {{ $.Values.logging.maskingLevel | quote }}
            {{- if $.Values.telemetry.endpoint }}
            - name: TRPC_OTEL_ENDPOINT
              value: {{ $.Values.telemetry.endpoint | quote }}
            - name: TRPC_OTEL_ALLOW_INSECURE
              value: {{ $.Values.telemetry.allowInsecure | quote }}
            {{- end }}
            {{- range $name, $value := $role.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $mountRuntimeSecrets }}
            - name: TRPC_SECRET_ROOT
              value: {{ $.Values.secretProvider.mountPath | quote }}
            {{- end }}
          {{- if $role.existingEnvSecret }}
          envFrom:
            - secretRef:
                name: {{ $role.existingEnvSecret }}
          {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http, scheme: HTTP}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /livez, port: http, scheme: HTTP}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /livez, port: http, scheme: HTTP}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["/trpc-service", "prestop"]
          resources:
            {{- toYaml $role.resources | nindent 12 }}
          {{- if $mountRuntimeSecrets }}
          volumeMounts:
            - name: projected-secrets
              mountPath: {{ $.Values.secretProvider.mountPath }}
              readOnly: {{ $.Values.secretProvider.readOnly }}
          {{- end }}
      {{- if $mountRuntimeSecrets }}
      volumes:
        - name: projected-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required (printf "roles.%s.secretProviderClass is required when secretProvider.enabled=true" $roleName) $role.secretProviderClass | quote }}
      {{- end }}
{{- end }}
{{- end }}
