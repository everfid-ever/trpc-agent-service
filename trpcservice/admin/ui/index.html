<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tRPC Agent 管理台</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:22px;margin:0}.muted{color:#667085;font-size:14px}.panel{background:#fff;border:1px solid #e6eaf0;border-radius:12px;padding:20px;margin-top:20px;box-shadow:0 1px 2px #1018280a}.login{max-width:480px;margin:8vh auto}label{display:block;font-size:14px;margin:12px 0 6px}input{width:100%;font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:7px}button{font:inherit;background:#0052d9;color:#fff;border:0;border-radius:7px;padding:9px 14px;cursor:pointer}button.secondary{background:#eef2f7;color:#344054}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{border:1px solid #e6eaf0;border-radius:9px;overflow:auto}h2{font-size:16px;margin:0;padding:14px 15px;border-bottom:1px solid #e6eaf0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid #f0f2f5;white-space:nowrap}th{color:#667085;font-weight:500;background:#fafbfc}.status{color:#b42318;margin-top:10px;font-size:14px}.ok{color:#027a48}@media(max-width:720px){.shell{padding:18px 12px}.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.panel{padding:14px}}
</style><body><main class="shell"><header><div><h1>tRPC Agent 管理台</h1><p class="muted">同源控制面 · 租户隔离 · 不展示密钥引用</p></div><button id="logout" class="secondary" hidden>退出</button></header><section id="login" class="panel login"><h2>管理员登录</h2><p class="muted">粘贴短期 Admin Bearer Token；令牌只会保存为当前站点的 HttpOnly 会话 Cookie。</p><label for="token">Admin Token</label><input id="token" type="password" autocomplete="off" placeholder="adm1.…"><p><button id="signin">登录</button></p><p id="loginStatus" class="status"></p></section><section id="dashboard" hidden><div id="tenant" class="panel"></div><div class="grid"><div class="card"><h2>Agent Apps</h2><table id="apps"></table></div><div class="card"><h2>Model Profiles</h2><table id="models"></table></div><div class="card"><h2>Channel Bindings</h2><table id="channels"></table></div><div class="card"><h2>配置入口</h2><div style="padding:15px" class="muted">配置发布、候选版本、灰度和回滚仍通过既有 Admin API 执行。此页面仅提供安全的目录读取视图。</div></div></div></section></main><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(id,cols,rows){$(id).innerHTML='<thead><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c[1](r))+'</td>').join('')+'</tr>').join('')+'</tbody>'}
async function load(){let r=await fetch('/v1/admin/catalog',{credentials:'same-origin'});if(!r.ok)throw Error(r.status===401?'登录已过期':'加载失败 '+r.status);let d=await r.json(),t=d.tenant;$('tenant').innerHTML='<h2>'+esc(t.display_name)+'</h2><p class="muted">'+esc(t.tenant_id)+' · '+esc(t.status)+' · 版本 '+t.version+' · 当前配置 '+t.active_config_version+'</p>';table('apps',[['名称',x=>x.display_name],['Key',x=>x.key],['状态',x=>x.status],['Revision',x=>x.current_revision]],d.apps);table('models',[['名称',x=>x.display_name],['Provider / Model',x=>x.provider+' / '+x.model],['状态',x=>x.status],['版本',x=>x.current_version]],d.models);table('channels',[['渠道',x=>x.channel],['账号',x=>x.external_account_id],['Agent',x=>x.agent_app_id],['配置版本',x=>x.config_version]],d.channels);$('login').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false}
$('signin').onclick=async()=>{let s=$('loginStatus');s.textContent='';let r=await fetch('/admin/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:$('token').value})});if(!r.ok){s.textContent='登录失败：请检查令牌或租户版本。';return}try{await load()}catch(e){s.textContent=e.message}};$('logout').onclick=async()=>{await fetch('/admin/session',{method:'DELETE'});location.reload()};load().catch(()=>{});
</script></body></html>
